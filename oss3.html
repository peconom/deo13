<!doctype html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ΟΣΣ3 ΔΕΟ13</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Source+Serif+4:wght@600;700&display=swap">
<style>
:root{
  color-scheme:light;
  --bg:#EEF3F9; --surface:#FFFFFF; --ink:#0E1A2B; --ink2:#51627A; --line:#D3DDEA;
  --blue:#0B5CA8; --blue-soft:#DCEAF8; --amber:#A8700F; --chip:#E3ECF7;
  --serif:'Source Serif 4',Georgia,'Times New Roman',serif;
  --sans:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0B1320; --surface:#121D2F; --ink:#E8EFF8; --ink2:#9BAEC8; --line:#26354D;
  --blue:#62AAF2; --blue-soft:#17304F; --amber:#E6B04B; --chip:#1A2A43; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B1320; --surface:#121D2F; --ink:#E8EFF8; --ink2:#9BAEC8; --line:#26354D;
  --blue:#62AAF2; --blue-soft:#17304F; --amber:#E6B04B; --chip:#1A2A43; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 var(--sans);padding-inline:16px;padding-block:20px 40px}
.app{max-width:1180px;margin-inline:auto;display:flex;flex-direction:column;gap:18px}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:6px 20px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:6px 8px 6px 16px}
.brand{font:600 16px var(--serif);color:var(--ink);text-decoration:none;display:flex;align-items:baseline;gap:10px}
.brand small{font:500 11px var(--mono);letter-spacing:.14em;color:var(--blue)}
.oss{display:flex;gap:4px;overflow-x:auto;max-width:100%}
.oss a{padding:8px 14px;border-radius:8px;color:var(--ink);text-decoration:none;font:500 13px var(--mono);letter-spacing:.04em;white-space:nowrap}
.oss a:hover{background:var(--chip)} .oss a[aria-current="page"]{background:var(--blue);color:#fff;font-weight:600}
.oss a:focus-visible,.brand:focus-visible,.go:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:clamp(22px,5vw,48px);display:flex;flex-direction:column;gap:18px;align-items:flex-start;min-width:0}
.eyebrow{font:500 12px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--blue)}
h1{font:700 clamp(28px,5vw,44px)/1.1 var(--serif);margin:0;text-wrap:balance}
p{margin:0;max-width:56ch;color:var(--ink2)}
.stripes{width:min(320px,100%);height:14px;border-radius:7px;background:repeating-linear-gradient(-45deg,var(--amber) 0 12px,var(--chip) 12px 24px);opacity:.9}
.go{display:inline-block;margin-top:6px;padding:10px 18px;border-radius:8px;background:var(--blue);color:#fff;text-decoration:none;font-weight:600;font-size:14px}
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <a class="brand" href="index.html"><small>ΔΕΟ13</small>Ποσοτικές Μέθοδοι</a>
    <div class="oss" role="navigation" aria-label="Ομαδικές Συμβουλευτικές Συναντήσεις">
      <a href="index.html">Αρχική</a><a href="oss1.html">ΟΣΣ1</a><a href="oss2.html">ΟΣΣ2</a><a href="oss3.html" aria-current="page">ΟΣΣ3</a><a href="oss4.html">ΟΣΣ4</a>
    </div>
  </div>
  <main class="panel">
    <div class="eyebrow">3η Ομαδική Συμβουλευτική Συνάντηση</div>
    <h1>ΟΣΣ3 υπό κατασκευή</h1>
    <div class="stripes" role="presentation"></div>
    <p>Το διαδραστικό υλικό αυτής της συνάντησης δεν είναι ακόμη έτοιμο. Θα προστεθεί σε αυτή τη σελίδα όταν ολοκληρωθεί.</p>
    <a class="go" href="oss1.html">Πήγαινε στην ΟΣΣ1</a>
  </main>
</div>
</body>
</html>
